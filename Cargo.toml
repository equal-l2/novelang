[package]
name = "novelang"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", default-features = false, features = [
  "derive",
  "std",
] }
derive_more = { version = "2.1.1", default-features = false, features = [
  "as_ref",
  "display",
  "from",
  "into",
] }

# required for fuzzing
arbitrary = { version = "1.4.2", default-features = false, features = [
  "derive_arbitrary",
], optional = true }

# TODO: replace with our own implementation
rand = { version = "0.10.1", default-features = false, features = ["sys_rng"] }

[dev-dependencies]
pretty_assertions = { version = "1.4.1", default-features = false, features = [
  "alloc",
] }
