[package]
name = "novelang-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
doc = false
name = "fuzz_compile"
path = "fuzz_targets/fuzz_compile.rs"
test = false

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

[dependencies.novelang]
path = ".."
features = ["arbitrary"]
